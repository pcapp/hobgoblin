[package]
name = "hobgoblin"
version = "0.1.0"
authors = ["Peter Cappetto"]
description = "A coding agent harness in Rust that speaks ACP."
edition = "2024"
rust-version = "1.96"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "sync"] }  # async runtime
async-openai = { version = "=0.32.4", features = ["byot", "chat-completion"] }
clap = { version = "4.3.14", features = ["derive"] }                 # CLI argument parsing
serde_json = "1.0.149"                                                # JSON serialization/deserialization
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"]}
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
schemars = "1.2.2"
gray_matter = "0.3.2"
